services:
  - type: web
    name: sikpspams-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: "SI-KPSPAMS KUAJANG"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:e4j3W9x8qZ2Y6vL1R5tN8mK0pQ7sT3uV9x2y4z6a8b0="
      - key: APP_TIMEZONE
        value: Asia/Makassar
      - key: APP_URL
        value: "https://sikpspams-backend.onrender.com"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
