version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: sikpspams_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/storage/app/public:/var/www/backend/storage/app/public:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sikpspams_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sikpspams_prod_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://kpspams.desakuajang.id/api/v1
    networks:
      - sikpspams_prod_net

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: sikpspams_prod_backend
    restart: always
    volumes:
      - ./backend/storage:/var/www/backend/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sikpspams_prod_net

  queue_worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: sikpspams_prod_queue
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend/storage:/var/www/backend/storage
    env_file:
      - ./backend/.env.production
    depends_on:
      - backend
      redis:
        condition: service_healthy
    networks:
      - sikpspams_prod_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: sikpspams_prod_scheduler
    restart: always
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    volumes:
      - ./backend/storage:/var/www/backend/storage
    env_file:
      - ./backend/.env.production
    depends_on:
      - backend
    networks:
      - sikpspams_prod_net

  postgres:
    image: postgres:16-alpine
    container_name: sikpspams_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sikpspams_db}
      POSTGRES_USER: ${DB_USERNAME:-sikpspams_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-GantiDenganPasswordKuat2026!}
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sikpspams_admin} -d ${DB_DATABASE:-sikpspams_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sikpspams_prod_net

  redis:
    image: redis:7-alpine
    container_name: sikpspams_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-GantiPasswordRedis2026!}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-GantiPasswordRedis2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sikpspams_prod_net

networks:
  sikpspams_prod_net:
    driver: bridge

volumes:
  pg_prod_data:
  redis_prod_data:
